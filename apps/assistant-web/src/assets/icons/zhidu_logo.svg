<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- 调整对话气泡（问答）位置 -->
    <rect x="30" y="60" width="85" height="50" rx="10" ry="10" fill="none" stroke="#59B4C7" stroke-width="3"/>
    <text x="42" y="92" font-size="20" font-family="Arial" fill="#59B4C7">Q&amp;A</text>
    
    <!-- 调整文档图标（制度）位置 -->
    <rect x="90" y="45" width="70" height="100" rx="5" ry="5" fill="none" stroke="#59B4C7" stroke-width="3"/>
    <line x1="100" y1="60" x2="150" y2="60" stroke="#59B4C7" stroke-width="2"/>
    <line x1="100" y1="75" x2="150" y2="75" stroke="#59B4C7" stroke-width="2"/>
    <line x1="100" y1="90" x2="150" y2="90" stroke="#59B4C7" stroke-width="2"/>
    <line x1="100" y1="105" x2="150" y2="105" stroke="#59B4C7" stroke-width="2"/>
    
    <!-- 调整放大镜图标位置 -->
    <circle cx="127" cy="97" r="12" fill="none" stroke="#59B4C7" stroke-width="3"/>
    <line x1="137" y1="107" x2="153" y2="123" stroke="#59B4C7" stroke-width="3" stroke-linecap="round"/>
</svg>
