<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AssistAI 企业员工助手</title>
    <style>
      :root {
        color-scheme: light;
        --bg: oklch(97.9% 0.004 255);
        --panel: oklch(99.2% 0.002 255);
        --panel-soft: oklch(96.8% 0.004 255);
        --text: oklch(24.5% 0.014 248);
        --text-soft: oklch(46.5% 0.012 246);
        --text-faint: oklch(63.5% 0.011 244);
        --line: oklch(90% 0.004 255);
        --line-strong: oklch(85% 0.005 255);
        --accent: oklch(67% 0.11 212);
        --accent-soft: oklch(95.8% 0.024 206);
        --accent-strong: oklch(62% 0.115 208);
        --accent-gradient: linear-gradient(135deg, oklch(75% 0.11 199), oklch(65% 0.11 214));
        --brand-mark: oklch(72% 0.106 204);
        --brand-mark-border: oklch(65% 0.108 206);
        --send-start: oklch(71% 0.113 201);
        --send-end: oklch(63% 0.121 209);
        --shadow-sm: 0 2px 8px rgba(23, 28, 38, 0.04);
        --shadow-md: 0 12px 30px rgba(23, 28, 38, 0.06);
        --focus-ring: 0 0 0 3px rgba(71, 185, 210, 0.18);
        --sidebar-width: 272px;
        --topbar-height: 62px;
        --composer-height: 104px;
        --shell-radius: 18px;
        --content-max-width: 830px;
        --composer-max-width: 830px;
        --font-sans: "SF Pro Display", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        font-family: var(--font-sans);
        background:
          linear-gradient(180deg, rgba(247, 250, 252, 0.98), rgba(243, 247, 250, 0.98)),
          radial-gradient(circle at top left, rgba(120, 138, 189, 0.035), transparent 26%),
          radial-gradient(circle at bottom right, rgba(120, 138, 189, 0.028), transparent 22%),
          var(--bg);
        color: var(--text);
      }

      body {
        overflow: hidden;
      }

      button {
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        padding: 0;
        cursor: pointer;
      }

      textarea {
        font: inherit;
      }

      .app-shell {
        height: 100vh;
        padding: 0;
      }

      .app {
        height: 100%;
        display: grid;
        grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
        border: 0;
        border-radius: 0;
        overflow: hidden;
        background: rgba(249, 251, 252, 0.92);
        box-shadow: none;
      }

      .app.is-sidebar-hidden {
        grid-template-columns: 0 minmax(0, 1fr);
      }

      .sidebar {
        height: 100%;
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        gap: 14px;
        padding: 14px 14px 12px;
        background: linear-gradient(180deg, rgba(246, 248, 250, 0.98), rgba(241, 244, 247, 0.98));
        border-right: 1px solid rgba(216, 224, 230, 0.92);
        overflow: hidden;
        transition: transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .app.is-sidebar-hidden .sidebar {
        transform: translateX(-24px);
        opacity: 0;
        pointer-events: none;
      }

      .sidebar-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 4px;
      }

      .sidebar-brand {
        min-width: 0;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .brand {
        width: 34px;
        height: 34px;
        flex: none;
        display: grid;
        place-items: center;
        border-radius: 0;
        background: transparent;
        color: white;
        box-shadow: none;
      }

      .brand svg {
        width: 20px;
        height: 20px;
      }

      .brand img {
        width: 28px;
        height: 28px;
        display: block;
        object-fit: contain;
      }

      .brand-title {
        min-width: 0;
        color: rgba(47, 58, 70, 0.98);
        font-size: 15px;
        font-weight: 400;
        letter-spacing: -0.01em;
        white-space: nowrap;
        transform: translateY(1px);
      }

      .collapse-btn {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        color: var(--text-faint);
        transition: background 160ms cubic-bezier(0.2, 0.8, 0.2, 1), color 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .collapse-btn:hover {
        background: rgba(255, 255, 255, 0.92);
        color: var(--text-soft);
      }

      .new-chat {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 8px;
        min-height: 48px;
        padding: 0 13px;
        border-radius: 14px;
        border: 1px solid rgba(220, 227, 233, 0.94);
        background: rgba(251, 252, 253, 0.92);
        box-shadow:
          0 5px 14px rgba(23, 28, 38, 0.025),
          0 0 0 1px rgba(133, 210, 226, 0.02);
        transition: transform 160ms cubic-bezier(0.2, 0.8, 0.2, 1), border-color 160ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .new-chat:hover {
        transform: translateY(-1px);
        border-color: rgba(194, 208, 216, 0.98);
        background: rgba(252, 253, 254, 0.98);
        box-shadow:
          0 7px 16px rgba(23, 28, 38, 0.032),
          0 0 0 1px rgba(133, 210, 226, 0.028);
      }

      .new-chat.is-active {
        border-color: rgba(184, 204, 213, 0.98);
        background: rgba(252, 253, 254, 0.98);
        box-shadow:
          inset 0 0 0 1px rgba(225, 232, 237, 0.92),
          0 6px 14px rgba(23, 28, 38, 0.028);
      }

      .new-chat-main,
      .new-chat-side {
        display: inline-flex;
        align-items: center;
      }

      .new-chat-main {
        gap: 10px;
        font-size: 14px;
        font-weight: 400;
        color: rgba(47, 58, 70, 0.98);
      }

      .new-chat-main .icon {
        color: rgba(89, 180, 199, 0.92);
      }

      .new-chat-side {
        gap: 6px;
      }

      .keycap {
        min-width: 24px;
        height: 24px;
        padding: 0 6px;
        display: inline-grid;
        place-items: center;
        border-radius: 8px;
        border: 1px solid rgba(214, 221, 228, 0.96);
        background: rgba(252, 253, 254, 0.98);
        color: rgba(110, 119, 129, 0.92);
        font-size: 11px;
        font-weight: 600;
        box-shadow:
          inset 0 -1px 0 rgba(238, 242, 246, 0.9),
          0 1px 2px rgba(22, 28, 37, 0.03);
      }

      .sidebar-scroll {
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        display: grid;
        align-content: start;
        gap: 14px;
        padding-right: 2px;
      }

      .sidebar-scroll::-webkit-scrollbar {
        width: 8px;
      }

      .sidebar-scroll::-webkit-scrollbar-thumb {
        background: rgba(197, 203, 213, 0.8);
        border-radius: 999px;
      }

      .sidebar-group {
        display: grid;
        gap: 6px;
      }

      .history-group {
        position: relative;
      }

      .history-group.is-collapsed .history-list {
        display: none;
      }

      .nav-item,
      .history-item,
      .footer-item,
      .profile {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 11px;
        text-align: left;
      }

      .nav-item {
        min-height: 42px;
        padding: 0 10px;
        border-radius: 10px;
        color: rgba(47, 58, 70, 0.98);
        font-size: 15px;
        font-weight: 400;
      }

      .nav-item:hover,
      .history-item:hover,
      .footer-item:hover,
      .profile:hover {
        background: rgba(255, 255, 255, 0.72);
      }

      .nav-right {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .beta {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 0 8px;
        border-radius: 8px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
      }

      .section-title {
        width: 100%;
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 40px;
        padding: 0 14px;
        color: rgba(47, 58, 70, 0.98);
        font-size: 14px;
        font-weight: 400;
        letter-spacing: -0.01em;
        border-radius: 10px;
        transition: background 160ms cubic-bezier(0.2, 0.8, 0.2, 1), color 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .section-title:hover {
        background: rgba(255, 255, 255, 0.62);
      }

      .section-title-main {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .section-toggle-icon {
        margin-left: auto;
        color: rgba(128, 138, 148, 0.9);
        transition: transform 160ms cubic-bezier(0.2, 0.8, 0.2, 1), color 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .history-group.is-collapsed .section-toggle-icon {
        transform: rotate(-90deg);
      }

      .history-list {
        display: grid;
        gap: 4px;
        padding: 0 6px 0 26px;
      }

      .history-entry {
        position: relative;
        display: block;
      }

      .history-item {
        min-height: 32px;
        width: 100%;
        padding: 0 38px 0 12px;
        border-radius: 10px;
        color: rgba(84, 95, 107, 0.96);
        font-size: 13px;
        font-weight: 400;
        transition: background 160ms cubic-bezier(0.2, 0.8, 0.2, 1), color 160ms cubic-bezier(0.2, 0.8, 0.2, 1), transform 160ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .history-item:hover {
        transform: translateX(2px);
      }

      .history-entry:hover .history-item:not(.active),
      .history-entry:focus-within .history-item:not(.active) {
        background: rgba(255, 255, 255, 0.88);
        color: rgba(72, 84, 96, 0.98);
      }

      .history-item.active {
        background: rgba(255, 255, 255, 0.98);
        color: rgba(72, 84, 96, 0.98);
        box-shadow:
          inset 0 0 0 1px rgba(228, 233, 238, 0.98),
          0 6px 14px rgba(24, 31, 41, 0.03);
      }

      .history-entry.is-menu-open .history-item:not(.active) {
        background: rgba(255, 255, 255, 0.88);
        color: rgba(72, 84, 96, 0.98);
      }

      .history-item.more {
        color: var(--text-soft);
      }

      .history-more {
        position: absolute;
        top: 50%;
        right: 6px;
        transform: translateY(-50%);
        width: 24px;
        height: 24px;
        display: grid;
        place-items: center;
        border-radius: 6px;
        color: rgba(118, 129, 141, 0.88);
        opacity: 0;
        pointer-events: none;
        transition: background 160ms cubic-bezier(0.2, 0.8, 0.2, 1), color 160ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .history-entry:hover .history-more,
      .history-entry:focus-within .history-more,
      .history-entry.is-menu-open .history-more {
        opacity: 1;
        pointer-events: auto;
      }

      .history-more:hover,
      .history-entry.is-menu-open .history-more {
        background: rgba(255, 255, 255, 0.9);
        color: rgba(72, 84, 96, 0.94);
      }

      .history-menu {
        position: fixed;
        z-index: 30;
        width: 156px;
        padding: 6px;
        display: none;
        grid-auto-flow: row;
        gap: 1px;
        border: 1px solid rgba(232, 236, 240, 0.98);
        border-radius: 16px;
        background: rgba(253, 253, 254, 0.99);
        box-shadow:
          0 18px 36px rgba(23, 28, 38, 0.08),
          0 2px 8px rgba(23, 28, 38, 0.035);
      }

      .history-menu.is-open {
        display: grid;
      }

      .history-menu-item {
        min-height: 36px;
        padding: 0 9px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 10px;
        color: rgba(56, 67, 79, 0.96);
        font-size: 14px;
        font-weight: 400;
        white-space: nowrap;
        transition: background 160ms cubic-bezier(0.2, 0.8, 0.2, 1), color 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .history-menu-item .icon {
        margin-left: -1px;
      }

      .history-menu-item:hover {
        background: rgba(244, 247, 250, 0.96);
      }

      .history-menu-item.is-danger {
        color: rgba(184, 72, 72, 0.96);
      }

      .sidebar-footer {
        position: relative;
        display: grid;
        gap: 3px;
        padding-top: 10px;
        border-top: 1px solid rgba(220, 227, 232, 0.92);
      }

      .footer-item {
        min-height: 40px;
        padding: 0 10px;
        border-radius: 10px;
        color: rgba(47, 58, 70, 0.98);
        font-size: 15px;
        font-weight: 400;
      }

      .profile {
        min-height: 44px;
        padding: 0 8px 0 10px;
        border-radius: 12px;
        justify-content: space-between;
        background: transparent;
        border: 0;
        box-shadow: none;
      }

      .profile-main {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
      }

      .avatar {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(180deg, rgba(212, 146, 114, 0.96), rgba(190, 124, 95, 0.96));
        color: white;
        font-size: 12px;
        font-weight: 600;
        box-shadow: none;
      }

      .profile-name {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        font-size: 14px;
        color: rgba(47, 58, 70, 0.98);
        font-weight: 400;
      }

      .profile-menu {
        position: absolute;
        left: -14px;
        right: -14px;
        bottom: calc(100% + 6px);
        padding: 10px 14px 8px;
        display: none;
        grid-auto-flow: row;
        gap: 2px;
        border: 0;
        border-radius: 0;
        background: linear-gradient(180deg, rgba(246, 248, 250, 0.98), rgba(241, 244, 247, 0.98));
        box-shadow: none;
      }

      .profile-menu.is-open {
        display: grid;
      }

      .profile-menu-item {
        min-height: 36px;
        padding: 0 10px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 10px;
        color: rgba(56, 67, 79, 0.96);
        font-size: 13px;
        font-weight: 400;
        transition: background 160ms cubic-bezier(0.2, 0.8, 0.2, 1), color 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .profile-menu-item:hover {
        background: rgba(244, 247, 250, 0.96);
      }

      .profile-menu-item.is-danger {
        color: rgba(184, 72, 72, 0.96);
      }

      .main {
        min-width: 0;
        min-height: 0;
        background: rgba(255, 255, 255, 0.98);
      }

      .main-layout {
        height: 100%;
        display: grid;
        grid-template-rows: var(--topbar-height) minmax(0, 1fr) auto;
        min-height: 0;
      }

      .main-layout.is-empty {
        grid-template-rows: var(--topbar-height) minmax(0, 1fr);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 26px;
        border-bottom: 1px solid rgba(232, 236, 240, 0.92);
        background: rgba(255, 255, 255, 0.78);
        backdrop-filter: blur(10px);
      }

      .topbar-left,
      .topbar-right {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .crumb {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        max-width: 280px;
        font-size: 14px;
        font-weight: 400;
        color: var(--text);
      }

      .crumb-title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .crumb-meta {
        color: var(--text-faint);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
      }

      .top-actions {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--text-soft);
      }

      .top-action {
        width: 32px;
        height: 32px;
        display: inline-grid;
        place-items: center;
        border-radius: 9px;
        color: var(--text-soft);
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(233, 237, 241, 0.92);
        transition: background 160ms cubic-bezier(0.2, 0.8, 0.2, 1), color 160ms cubic-bezier(0.2, 0.8, 0.2, 1), transform 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .top-action:hover {
        background: rgba(255, 255, 255, 0.98);
        color: var(--text);
      }

      .top-action.is-active {
        background: rgba(242, 250, 252, 0.94);
        color: var(--accent-strong);
      }

      .sidebar-trigger {
        display: none;
      }

      .app.is-sidebar-hidden .sidebar-trigger {
        display: inline-grid;
      }

      .action-feedback {
        max-width: 240px;
        min-height: 28px;
        padding: 0 10px;
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        background: rgba(246, 249, 251, 0.96);
        border: 1px solid rgba(232, 235, 239, 0.98);
        color: var(--text-soft);
        font-size: 12px;
        white-space: nowrap;
        opacity: 0;
        transform: translateY(-2px);
        pointer-events: none;
        transition: opacity 160ms cubic-bezier(0.2, 0.8, 0.2, 1), transform 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .action-feedback.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .main-scroll {
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
      }

      .main-layout.is-empty .main-scroll {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 28px;
      }

      .main-scroll::-webkit-scrollbar {
        width: 8px;
      }

      .main-scroll::-webkit-scrollbar-thumb {
        background: rgba(197, 203, 213, 0.8);
        border-radius: 999px;
      }

      .content {
        width: min(100%, calc(var(--content-max-width) + 52px));
        margin: 0 auto;
        padding: 14px 26px 56px;
      }

      .main-layout.is-focus-mode .content {
        width: min(100%, 980px);
      }

      .main-layout.is-focus-mode .article-intro {
        color: var(--text);
      }

      .main-layout.is-focus-mode .text-card {
        width: auto;
      }

      .empty-view {
        display: none;
        width: 100%;
        max-width: 1040px;
        min-height: 100%;
        align-items: center;
        justify-content: center;
      }

      .main-layout.is-empty .empty-view {
        display: flex;
      }

      .main-layout.is-empty .content {
        display: none;
      }

      .empty-shell {
        width: 100%;
        max-width: 920px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }

      .empty-hero {
        display: flex;
        align-items: center;
        gap: 14px;
        color: var(--text);
      }

      .empty-logo {
        width: 40px;
        height: 40px;
        flex: none;
        display: grid;
        place-items: center;
        border-radius: 0;
        background: transparent;
        color: white;
        box-shadow: none;
      }

      .empty-logo svg {
        width: 24px;
        height: 24px;
      }

      .empty-logo img {
        width: 34px;
        height: 34px;
        display: block;
        object-fit: contain;
      }

      .empty-title {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .empty-support {
        max-width: 600px;
        margin: 0;
        color: var(--text-soft);
        font-size: 14px;
        line-height: 1.7;
        text-align: center;
      }

      .suggestion-label {
        margin: 8px 0 0;
        color: var(--text-faint);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .suggestion-strip {
        width: 100%;
        max-width: 760px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }

      .prompt-chip {
        min-height: 38px;
        padding: 0 16px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(232, 235, 239, 0.98);
        color: var(--text-soft);
        font-size: 13px;
        font-weight: 600;
        transition: background 160ms cubic-bezier(0.2, 0.8, 0.2, 1), border-color 160ms cubic-bezier(0.2, 0.8, 0.2, 1), color 160ms cubic-bezier(0.2, 0.8, 0.2, 1), transform 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .prompt-chip:hover {
        transform: translateY(-1px);
        color: var(--text);
        border-color: rgba(189, 223, 230, 0.95);
        box-shadow: 0 8px 18px rgba(23, 28, 38, 0.05);
      }

      .main-layout.is-empty .composer-wrap {
        display: none;
      }

      .article {
        display: grid;
        gap: 18px;
        padding: 2px 0 18px;
      }

      .message-row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }

      .message-row.user-row {

      .steps li::before {

        top: 14px;
        left: -15px;
        width: 16px;
        height: 16px;

        place-items: center;
        border-radius: 999px;
        background: rgba(71, 185, 210, 0.88);

        color: transparent;
        font-size: 0;

        right: 12px;

      .round-btn {

        height: 40px;

        border: 1px solid rgba(232, 235, 239, 0.95);
        background: rgba(255, 255, 255, 0.96);
        transition: transform 160ms cubic-bezier(0.2, 0.8, 0.2, 1), border-color 160ms cubic-bezier(0.2, 0.8, 0.2, 1), background 160ms cubic-bezier(0.2, 0.8, 0.2, 1), color 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .round-btn:hover,
      .model-chip:hover,
      .send-btn:hover {
        transform: translateY(-1px);
      }

      .round-btn:active,
      .model-chip:active,
      .send-btn:active,
      .prompt-chip:active,
      .history-item:active,
      .top-action:active,
      .meta-action:active {
        transform: translateY(0);

      .composer-left .round-btn:first-child {
        color: var(--accent-strong);
        border-color: rgba(189, 223, 230, 0.95);
        background: rgba(242, 250, 252, 0.94);

      .round-btn.is-active {
        color: var(--accent-strong);
        border-color: rgba(189, 223, 230, 0.98);
        background: rgba(242, 250, 252, 0.94);
      }

      .model-chip {
        height: 40px;
        padding: 0 12px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        color: var(--accent-strong);
        transition: color 160ms cubic-bezier(0.2, 0.8, 0.2, 1), background 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .model-chip.is-open {
        color: var(--text);
        background: rgba(246, 248, 250, 0.96);
      }

      .model-chip .icon {
        color: var(--accent-strong);
      }

      .model-chip.is-open .icon {
        color: var(--text-soft);

      .model-chip .icon {
        transition: transform 160ms cubic-bezier(0.2, 0.8, 0.2, 1), color 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .model-menu {

        bottom: calc(100% + 8px);

        border: 1px solid rgba(232, 236, 240, 0.98);
        border-radius: 14px;
        background: rgba(253, 253, 254, 0.99);

        display: grid;
      }

      .model-option {
        min-height: 34px;
        padding: 0 10px;
        display: inline-flex;
        align-items: center;
        border-radius: 10px;

        font-weight: 400;

        height: 36px;
        border-radius: 12px;

      .send-btn:hover {

      .footnote {
        margin-top: 2px;

        color: rgba(118, 129, 141, 0.92);
        font-size: 11px;
        flex: none;

      .meta-action {
        width: 28px;
        height: 28px;
        display: inline-grid;
        place-items: center;
        border-radius: 7px;
        color: inherit;
        transition: background 160ms cubic-bezier(0.2, 0.8, 0.2, 1), color 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .meta-action:hover {
        background: rgba(246, 248, 250, 0.96);
        color: var(--text);
      }

      .meta-action.is-active {
        background: rgba(242, 250, 252, 0.94);
        color: var(--accent-strong);
      }

      button:focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
      }

      .mobile-backdrop {
        display: none;
      }

      .icon {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }

      .icon-sm {
        width: 16px;
        height: 16px;
      }

      @media (max-width: 1120px) {

      @media (max-width: 900px) {

          padding: 0;

          border-radius: 0;
          border-left: 0;
          border-right: 0;

          top: 0;
          left: 0;
          bottom: 0;
          width: min(82vw, 320px);
          z-index: 30;
          box-shadow: 0 18px 48px rgba(23, 28, 38, 0.16);
          transform: translateX(-100%);

          pointer-events: none;

          grid-template-columns: 1fr;
        }

        .app.is-mobile-nav-open .sidebar {
          transform: translateX(0);
          opacity: 1;
          pointer-events: auto;
        }

        .sidebar-trigger {
          display: inline-grid;
        }

        .mobile-backdrop {
          position: fixed;
          inset: 0;
          display: block;
          background: rgba(18, 24, 32, 0.16);
          opacity: 0;
          pointer-events: none;
          transition: opacity 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
          z-index: 20;

        .app.is-mobile-nav-open + .mobile-backdrop {
          opacity: 1;
          pointer-events: auto;
        }

        .topbar {
          padding: 0 16px;
        }

        .content {
          width: min(100%, calc(var(--content-max-width) + 20px));
          padding: 22px 14px 30px;
        }

        .main-layout.is-empty .main-scroll {
          padding: 20px 14px;
        }

        .empty-composer-area,
        .composer-area {
          width: min(100%, calc(var(--composer-max-width) + 20px));
          padding: 12px 14px 10px;
        }

        .article {
          padding: 2px 2px 6px;
        }
      }

      @media (max-width: 680px) {
        :root {
          --topbar-height: 54px;
          --composer-height: 112px;
        }

        .section-heading {
          font-size: 18px;
        }

        .article-intro,
        .section-block,
        .text-card {
          padding-left: 18px;
          padding-right: 18px;
        }

        .section-body {
          font-size: 15px;
        }

        .empty-shell {
          gap: 22px;
        }

        .empty-title {
          font-size: 28px;
        }

        .empty-support {
          font-size: 14px;
        }

        .composer-bottom {
          flex-direction: column;
          align-items: stretch;
        }

        .composer-left,
        .composer-right {
          justify-content: space-between;
        }

        .article-intro {
          max-width: 100%;
          padding: 16px 18px;
        }

        .section-block,
        .text-card {
          width: 100%;
        }

        .steps li {
          padding-left: 38px;
          padding-right: 34px;
          margin-left: 10px;
        }
      }
    </style>

        "我先给你一版文字版回答，重点会放在背景、问题、处理方式和预期结果，方便你后续继续追问细节。",

      function cancelHistoryMenuClose() {
        window.clearTimeout(historyMenuTimer);
      }

      function queueHistoryMenuClose() {
        window.clearTimeout(historyMenuTimer);
        historyMenuTimer = window.setTimeout(() => {
          closeHistoryMenu();
        }, 140);
      }

      function closeHistoryMenu() {
        cancelHistoryMenuClose();
        historyMenu?.classList.remove("is-open");
        historyMenu?.setAttribute("aria-hidden", "true");
        activeHistoryEntry?.classList.remove("is-menu-open");
        activeHistoryEntry = null;
      }

      function openHistoryMenu(trigger) {
        if (!historyMenu || !historyGroup) return;
        const entry = trigger.closest(".history-entry");
        if (!entry) return;

        if (activeHistoryEntry === entry && historyMenu.classList.contains("is-open")) {
          closeHistoryMenu();
          return;
        }

        activeHistoryEntry?.classList.remove("is-menu-open");
        activeHistoryEntry = entry;
        entry.classList.add("is-menu-open");
        cancelHistoryMenuClose();

        const triggerRect = trigger.getBoundingClientRect();
        historyMenu.classList.add("is-open");
        historyMenu.setAttribute("aria-hidden", "false");
        historyMenu.style.visibility = "hidden";

        const menuRect = historyMenu.getBoundingClientRect();
        const menuWidth = menuRect.width || 226;
        const menuHeight = menuRect.height || 320;
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        const gap = 10;
        const edge = 12;

        const openUp = viewportHeight - triggerRect.bottom < menuHeight + edge && triggerRect.top > menuHeight / 2;
        const top = openUp
          ? Math.max(edge, triggerRect.bottom - menuHeight)
          : Math.min(viewportHeight - menuHeight - edge, triggerRect.top);

        let left = triggerRect.right + gap;
        if (left + menuWidth > viewportWidth - edge) {
          left = triggerRect.left - menuWidth - gap;
        }
        left = Math.max(edge, Math.min(left, viewportWidth - menuWidth - edge));

        historyMenu.style.top = `${top}px`;
        historyMenu.style.left = `${left}px`;
        historyMenu.dataset.placement = openUp ? "top" : "bottom";
        historyMenu.style.visibility = "";
      }

      function getVisibleComposerInput() {
        if (mainLayout.classList.contains("is-empty")) {
          return document.querySelector(".empty-view .composer-input");

        historyItems.forEach((item) => item.classList.remove("active"));
      }

      function setHistoryActive(label) {
        historyItems.forEach((item) => {
          item.classList.toggle("active", item.textContent.trim() === label && !item.classList.contains("more"));

      function escapeHtml(value) {
        return value
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function buildResponseSections(paragraphs) {
        const safeParagraphs = Array.isArray(paragraphs) ? paragraphs.filter(Boolean) : [];
        if (!safeParagraphs.length) return "";

        const first = safeParagraphs[0];
        const last = safeParagraphs.length > 1 ? safeParagraphs[safeParagraphs.length - 1] : safeParagraphs[0];
        const middle = safeParagraphs.slice(1, -1);
        const coreParagraphs = middle.length ? middle : safeParagraphs.length > 1 ? [safeParagraphs[1]] : [safeParagraphs[0]];

        const sections = [
          {
            title: "关键结论",
            icon: `<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 3v11"></path><path d="m8 10 4-7 4 7"></path><path d="M10 18h4"></path><path d="M9 21h6"></path></svg>`,
            paragraphs: [first]
          },
          {
            title: "核心思路",
            icon: `<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M4 12h16"></path><path d="M12 4v16"></path><circle cx="12" cy="12" r="8"></circle></svg>`,
            paragraphs: coreParagraphs
          }
        ];

        if (safeParagraphs.length > 1) {
          sections.push({
            title: "下一步建议",
            icon: `<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>`,
            paragraphs: [last]
          });
        }

        return sections
          .map(
            (section) => `
              <section class="response-section">
                <div class="response-heading">
                  ${section.icon}
                  <span>${section.title}</span>
                </div>
                <div class="response-divider" aria-hidden="true"></div>
                <div class="response-copy">
                  ${section.paragraphs.map((text) => `<p>${escapeHtml(text)}</p>`).join("")}
                </div>
              </section>
            `
          )
          .join("");
      }

              assistant: generatedAnswerTemplates

        const assistantSections = buildResponseSections(session.assistant);

        articleThread.innerHTML = `
          <div class="message-row user-row">
            <p class="article-intro">${escapeHtml(session.user)}</p>
          </div>
          <div class="message-row agent-row">
            <div class="agent-avatar" aria-hidden="true">
              <img src="./assistant-avatar.svg" alt="" />
            </div>
            <section class="text-card">
              <div class="response-panel">
                ${assistantSections}
              </div>
              <div class="assistant-actions">
                <button class="meta-action" aria-label="刷新演示结果">
                  <svg class="icon" viewBox="0 0 24 24">
                    <path d="M7.2 8.3A6.5 6.5 0 0 1 18 10"></path>
                    <path d="M17.5 5.5V10H13"></path>
                    <path d="M16.8 15.7A6.5 6.5 0 0 1 6 14"></path>
                    <path d="M6.5 18.5V14H11"></path>
                  </svg>
                </button>
                <button class="meta-action" aria-label="导出内容">
                  <svg class="icon" viewBox="0 0 24 24">
                    <path d="M10 5H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3"></path>
                    <path d="M14 5h3a2 2 0 0 1 2 2v3"></path>
                    <path d="m13 11 6 0"></path>
                    <path d="m16 8 3 3-3 3"></path>
                    <path d="M10 19h4"></path>
                  </svg>
                </button>
              </div>
            </section>
          </div>
        `;
      }

      function showEmptyState(shouldFocus = false) {
        mainLayout.classList.add("is-empty");
        mainLayout.classList.remove("is-focus-mode");
        focusModeButton?.classList.remove("is-active");
        newChatButton.classList.add("is-active");
        crumbTitle.textContent = "新建会话";
        clearHistoryActive();
        composerInputs.forEach((field) => {
          field.value = "";
        });
        closeMobileNav();

        if (shouldFocus) {
          window.requestAnimationFrame(() => {
            getVisibleComposerInput()?.focus();
          });
        }
      }

      function showArticleState(label, options = {}) {
        const { syncHistory = true, generated = false, prompt = "" } = options;
        mainLayout.classList.remove("is-empty");
        newChatButton.classList.remove("is-active");
        crumbTitle.textContent = label;
        renderThread(label, { generated, prompt });

        if (syncHistory) {
          setHistoryActive(label);
        } else {
          clearHistoryActive();
        }

        closeMobileNav();
      }

      function toggleSidebarSurface() {
        if (isMobileView()) {
          app.classList.toggle("is-mobile-nav-open");
          return;
        }

        app.classList.toggle("is-sidebar-hidden");
        showFeedback(app.classList.contains("is-sidebar-hidden") ? "已收起历史会话" : "已展开历史会话");
      }

      function syncModelLabel(label) {
        modelChips.forEach((chip) => {
          const textNode = chip.querySelector("span");
          if (textNode) textNode.textContent = label;
        });
        modelOptions.forEach((option) => {
          option.classList.toggle("is-active", option.dataset.model === label);
        });
      }

      function closeModelMenus() {
        modelChips.forEach((chip) => {
          chip.classList.remove("is-open");
          chip.setAttribute("aria-expanded", "false");
        });
        modelMenus.forEach((menu) => {
          menu.classList.remove("is-open");
          menu.setAttribute("aria-hidden", "true");
        });
      }

      function submitCurrentInput(input) {
        const targetInput = input || getVisibleComposerInput();
        if (!targetInput) return;

        const question = targetInput.value.trim();
        if (!question) {
          targetInput.focus();
          showFeedback("先输入一个具体任务，再开始演示");
          return;
        }

        const shortTitle = question.length > 18 ? `${question.slice(0, 18)}...` : question;
        showArticleState(shortTitle, { syncHistory: false, generated: true, prompt: question });
        composerInputs.forEach((field) => {
          field.value = "";
        });
        showFeedback("已生成一版演示内容");
      }

      newChatButton.addEventListener("click", () => {
        showEmptyState(true);
      });

      collapseButton.addEventListener("click", toggleSidebarSurface);
      sidebarTrigger?.addEventListener("click", toggleSidebarSurface);
      mobileBackdrop?.addEventListener("click", closeMobileNav);
      historyToggle?.addEventListener("click", () => {
        const nextCollapsed = !historyGroup?.classList.contains("is-collapsed");
        historyGroup?.classList.toggle("is-collapsed", nextCollapsed);
        historyToggle.setAttribute("aria-expanded", String(!nextCollapsed));
      });
      profileButton?.addEventListener("click", () => {
        const nextOpen = !profileMenu?.classList.contains("is-open");
        closeHistoryMenu();
        closeProfileMenu();
        if (nextOpen) {
          profileMenu?.classList.add("is-open");
          profileMenu?.setAttribute("aria-hidden", "false");
        }
      });

      profileMenuItems.forEach((item) => {
        item.addEventListener("click", () => {
          const action = item.dataset.action;
          closeProfileMenu();
          showFeedback(action === "settings" ? "已打开设置（演示）" : "已退出登录（演示）");
        });
      });

      focusModeButton?.addEventListener("click", () => {
        const nextState = !mainLayout.classList.contains("is-focus-mode");
        mainLayout.classList.toggle("is-focus-mode", nextState);
        focusModeButton.classList.toggle("is-active", nextState);
        showFeedback(nextState ? "已切换到专注阅读" : "已退出专注阅读");
      });

      historyItems.forEach((item) => {
        item.addEventListener("click", () => {
          const label = item.textContent.trim();
          const isMore = item.classList.contains("more");
          closeHistoryMenu();
          showArticleState(isMore ? "历史会话" : label, { syncHistory: !isMore, generated: false });
          showFeedback(isMore ? "已展开更多历史会话（演示）" : `已打开“${label}”`);
        });
      });

      historyMenuButtons.forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          openHistoryMenu(button);
        });
      });

      document.querySelectorAll(".history-entry").forEach((entry) => {
        entry.addEventListener("mouseenter", cancelHistoryMenuClose);
        entry.addEventListener("mouseleave", () => {
          if (activeHistoryEntry === entry && historyMenu?.classList.contains("is-open")) {
            queueHistoryMenuClose();
          }
        });
      });

      historyMenu?.addEventListener("mouseenter", cancelHistoryMenuClose);
      historyMenu?.addEventListener("mouseleave", queueHistoryMenuClose);

      historyMenuItems.forEach((item) => {
        item.addEventListener("click", () => {
          if (!activeHistoryEntry) return;
          const targetItem = activeHistoryEntry.querySelector(".history-item");
          if (!targetItem) return;

          const action = item.dataset.action;
          const label = targetItem.textContent.trim();

          if (action === "rename") {
            if (!label.includes(" · 已整理")) {
              targetItem.textContent = `${label} · 已整理`;
            }
            showFeedback(`已编辑“${label}”标题（演示）`);
          } else if (action === "pin") {
            const historyList = document.getElementById("historyList");
            historyList?.insertBefore(activeHistoryEntry, historyList.firstElementChild);
            showFeedback(`已置顶“${label}”`);
          } else if (action === "delete") {
            activeHistoryEntry.remove();
            showFeedback(`已删除“${label}”（演示）`);
          }

          closeHistoryMenu();
        });
      });

      document.addEventListener("click", (event) => {
        if (!historyMenu?.classList.contains("is-open")) return;
        if (historyMenu.contains(event.target)) return;
        if (event.target.closest(".history-more")) return;
        closeHistoryMenu();
      });

      document.addEventListener("click", (event) => {
        if (!profileMenu?.classList.contains("is-open")) return;
        if (profileMenu.contains(event.target)) return;
        if (event.target.closest(".profile")) return;
        closeProfileMenu();
      });

      window.addEventListener("resize", closeHistoryMenu);
      sidebarScroll?.addEventListener("scroll", closeHistoryMenu);

      promptChips.forEach((chip) => {
        chip.addEventListener("click", () => {
          const input = getVisibleComposerInput();
          if (!input) return;
          input.value = chip.dataset.prompt || chip.textContent.trim();
          submitCurrentInput(input);
        });
      });

      sendButtons.forEach((button) => {
        button.addEventListener("click", () => {
          submitCurrentInput(getVisibleComposerInput());
        });
      });

      composerInputs.forEach((input) => {
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            submitCurrentInput(input);
          }
        });
      });

      roundButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const label = button.getAttribute("aria-label");
          const isVoice = label === "语音";
          button.classList.toggle("is-active");
          showFeedback(isVoice ? (button.classList.contains("is-active") ? "已打开语音入口（演示）" : "已关闭语音入口") : "已打开附件入口（演示）");
        });
      });

      modelChips.forEach((chip) => {
        chip.addEventListener("click", (event) => {
          event.stopPropagation();
          const select = chip.closest(".model-select");
          const menu = select?.querySelector(".model-menu");
          const shouldOpen = !chip.classList.contains("is-open");
          closeModelMenus();
          if (!shouldOpen || !menu) return;
          chip.classList.add("is-open");
          chip.setAttribute("aria-expanded", "true");
          menu.classList.add("is-open");
          menu.setAttribute("aria-hidden", "false");
        });
      });

      modelOptions.forEach((option) => {
        option.addEventListener("click", (event) => {
          event.stopPropagation();
          const nextModel = option.dataset.model;
          if (!nextModel) return;
          currentModelIndex = modelSequence.indexOf(nextModel);
          if (currentModelIndex < 0) currentModelIndex = 0;
          syncModelLabel(nextModel);
          closeModelMenus();
          showFeedback(`已切换到 ${nextModel}`);
        });
      });

      articleThread?.addEventListener("click", (event) => {
        const metaAction = event.target.closest(".meta-action");

        if (metaAction) {
          const label = metaAction.getAttribute("aria-label");
          if (label === "复制内容") {
            metaAction.classList.add("is-active");
            window.setTimeout(() => metaAction.classList.remove("is-active"), 1200);
            showFeedback("内容已复制到演示剪贴板");
            return;
          }

          metaAction.classList.toggle("is-active");
          showFeedback(`${label}已执行（演示）`);
        }
      });

      renderThread("入职 IT 工具使用指南");

      document.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
          event.preventDefault();
          showEmptyState(true);
          showFeedback("已定位到新建会话");
        }

        if (event.key === "Escape") {
          closeProfileMenu();
          closeModelMenus();
          closeMobileNav();
        }
      });

      document.addEventListener("click", (event) => {
        if (event.target.closest(".model-select")) return;
        closeModelMenus();
      });
    </script>
  </body>
</html>
