<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatGemini 静态版 - 管理后台 / 模型</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button class="sidebar-toggle" type="button" data-sidebar-toggle>☰</button>
    <div class="site-shell">
        <aside class="sidebar">
            <div class="brand"><div class="brand-logo">AD</div><div class="brand-copy"><strong>管理后台</strong><span>Admin Console</span></div></div>
            <div class="sidebar-section-title">导航</div>
            <nav class="nav-group">
                <a class="nav-link" href="admin-models.html" data-page="admin-models.html"><span class="nav-dot"></span>模型配置</a>
                <a class="nav-link" href="admin-gpts.html" data-page="admin-gpts.html"><span class="nav-dot"></span>智能体管理</a>
                <a class="nav-link" href="admin-permissions.html" data-page="admin-permissions.html"><span class="nav-dot"></span>权限配置</a>
                <a class="nav-link" href="admin-flags.html" data-page="admin-flags.html"><span class="nav-dot"></span>功能开关</a>
                <a class="nav-link" href="admin-audit.html" data-page="admin-audit.html"><span class="nav-dot"></span>审计日志</a>
            </nav>
        </aside>
        <div class="main-shell">
            <header class="topbar">
                <div><h1>管理员配置台</h1><p>对齐 `AdminConfig` 的多分区布局，当前为模型配置标签页。</p></div>
                <div class="topbar-actions"><button class="primary-btn" type="button">新增模型</button></div>
            </header>
            <main class="page">
                <div class="admin-tabs">
                    <a class="tab-link active" href="admin-models.html">模型</a>
                    <a class="tab-link" href="admin-gpts.html">智能体</a>
                    <a class="tab-link" href="admin-permissions.html">权限</a>
                    <a class="tab-link" href="admin-flags.html">开关</a>
                    <a class="tab-link" href="admin-audit.html">审计</a>
                </div>
                <section class="panel" style="margin-top: 18px;">
                    <h2>模型列表</h2>
                    <table class="config-table">
                        <thead><tr><th>展示名</th><th>模型 ID</th><th>推理</th><th>工具调用</th><th>可见范围</th></tr></thead>
                        <tbody>
                            <tr><td>Gemini 2.5 Pro</td><td>gemini-2.5-pro</td><td>支持</td><td>支持</td><td>all</td></tr>
                            <tr><td>DeepSeek V3</td><td>deepseek-v3</td><td>支持</td><td>支持</td><td>all</td></tr>
                            <tr><td>GPT-4.1</td><td>gpt-4.1</td><td>关闭默认</td><td>支持</td><td>whitelist</td></tr>
                        </tbody>
                    </table>
                </section>
            </main>
        </div>
    </div>
    <script src="app.js"></script>

</html>
