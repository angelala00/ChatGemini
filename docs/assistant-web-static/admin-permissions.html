<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatGemini 静态版 - 管理后台 / 权限</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button class="sidebar-toggle" type="button" data-sidebar-toggle>☰</button>
    <div class="site-shell">
        <aside class="sidebar">
            <div class="brand"><div class="brand-logo">AD</div><div class="brand-copy"><strong>管理后台</strong><span>Admin Console</span></div></div>
            <div class="sidebar-section-title">导航</div>
            <nav class="nav-group">
                <a class="nav-link" href="admin-models.html" data-page="admin-models.html"><span class="nav-dot"></span>模型配置</a>
                <a class="nav-link" href="admin-gpts.html" data-page="admin-gpts.html"><span class="nav-dot"></span>智能体管理</a>
                <a class="nav-link" href="admin-permissions.html" data-page="admin-permissions.html"><span class="nav-dot"></span>权限配置</a>
                <a class="nav-link" href="admin-flags.html" data-page="admin-flags.html"><span class="nav-dot"></span>功能开关</a>
                <a class="nav-link" href="admin-audit.html" data-page="admin-audit.html"><span class="nav-dot"></span>审计日志</a>
            </nav>
        </aside>
        <div class="main-shell">
            <header class="topbar">
                <div><h1>权限配置</h1><p>还原权限表格、用户键、权限码、启用状态和备注区域。</p></div>
                <div class="topbar-actions"><button class="primary-btn" type="button">新增权限</button></div>
            </header>
            <main class="page">
                <div class="admin-tabs">
                    <a class="tab-link" href="admin-models.html">模型</a>
                    <a class="tab-link" href="admin-gpts.html">智能体</a>
                    <a class="tab-link active" href="admin-permissions.html">权限</a>
                    <a class="tab-link" href="admin-flags.html">开关</a>
                    <a class="tab-link" href="admin-audit.html">审计</a>
                </div>
                <section class="panel" style="margin-top: 18px;">
                    <table class="config-table">
                        <thead><tr><th>用户</th><th>权限码</th><th>状态</th><th>备注</th></tr></thead>
                        <tbody>
                            <tr><td>ops-admin</td><td>assistant.admin</td><td>enabled</td><td>后台管理员</td></tr>
                            <tr><td>frontend-lead</td><td>gpts.manage</td><td>enabled</td><td>管理智能体与知识文件</td></tr>
                            <tr><td>voice-tester</td><td>voice_lab.access</td><td>enabled</td><td>语音实验室灰度用户</td></tr>
                        </tbody>
                    </table>
                </section>
            </main>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
